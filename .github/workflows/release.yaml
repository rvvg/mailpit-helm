name: Release

# Runs only after CI succeeded on main, and builds exactly the commit CI tested.
# Publishing is idempotent: an already published chart version is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_VERSION: v3.22.1
  ORAS_VERSION: 1.3.4
  CHART_DIR: charts/mailpit

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # GitHub release
      packages: write       # push to ghcr.io
      id-token: write       # cosign keyless signing + provenance
      attestations: write   # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Resolve chart coordinates
        id: chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          name=$(yq .name "$CHART_DIR/Chart.yaml")
          version=$(yq .version "$CHART_DIR/Chart.yaml")
          registry="ghcr.io/${OWNER,,}/charts"
          {
            echo "name=$name"
            echo "version=$version"
            echo "registry=$registry"
            echo "ref=$registry/$name"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin

      # Independent of the chart version: metadata changes (e.g. repositoryID) are
      # published without a version bump. oras push of the same file is idempotent.
      - name: Publish Artifact Hub repository metadata
        env:
          REF: ${{ steps.chart.outputs.ref }}
        run: |
          oras push "$REF:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Skip if this version is already published
        id: exists
        env:
          REF: ${{ steps.chart.outputs.ref }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if helm show chart "oci://$REF" --version "$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF:$VERSION already exists, nothing to release"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        if: steps.exists.outputs.published == 'false'
        id: push
        env:
          REGISTRY: ${{ steps.chart.outputs.registry }}
        run: |
          helm package "$CHART_DIR" -d dist
          out=$(helm push dist/*.tgz "oci://$REGISTRY" 2>&1)
          echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign with cosign (keyless)
        if: steps.exists.outputs.published == 'false'
        env:
          REF: ${{ steps.chart.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF@$DIGEST"

      - name: Build provenance attestation
        if: steps.exists.outputs.published == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.chart.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        if: steps.exists.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          REF: ${{ steps.chart.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          changes=$(yq '.annotations["artifacthub.io/changes"]' "$CHART_DIR/Chart.yaml" | yq -r '.[] | "- " + .kind + ": " + .description')
          {
            echo "## Install"
            echo
            echo '```console'
            echo "helm install mailpit oci://$REF --version $VERSION"
            echo '```'
            echo
            echo "OCI digest: \`$DIGEST\` (signed with cosign keyless, build provenance attested)"
            echo
            echo "## Changes"
            echo
            echo "$changes"
          } > notes.md
          gh release create "$NAME-$VERSION" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" --title "$NAME $VERSION" --notes-file notes.md --target "$SHA"
