name: Lint and Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2.7.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: README is up to date
        run: make docs-check

      - name: Lint and validate manifests
        run: make lint

      - name: ct lint
        run: ct lint --config ct.yaml --all

      - name: Create kind cluster (Calico, NetworkPolicy aware)
        uses: helm/kind-action@v1.12.0
        with:
          config: hack/kind-calico.yaml

      - name: Install Calico
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s

      - name: ct install (every ci/*.yaml, helm test included)
        run: ct install --config ct.yaml --all
