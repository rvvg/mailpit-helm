{{- $m := .Values.mailpit }}
{{- $authSources := list }}
{{- range $name, $a := dict "ui" $m.ui.auth "smtp" $m.smtp.auth "sendApi" $m.sendApi.auth }}
{{- if $a.enabled }}
{{- $authSources = append $authSources (dict "secret" (dict "name" ($a.existingSecret | default (include "mailpit.authSecretName" $)) "items" (list (dict "key" $a.existingSecretKey "path" (printf "%s.htpasswd" $name))))) }}
{{- end }}
{{- end }}
{{- $allowedHosts := include "mailpit.allowedHosts" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mailpit.fullname" . }}
  labels: {{- include "mailpit.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "mailpit.fullname" . }}
  selector:
    matchLabels: {{- include "mailpit.selectorLabels" . | nindent 6 }}
  updateStrategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "mailpit.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "mailpit.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mailpit
          image: {{ include "mailpit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.extraArgs }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $smtpCert := "" }}
            {{- if and $m.smtp.tls.enabled $m.smtp.tls.selfSigned }}
            {{- $smtpCert = printf "sans:%s" (concat (include "mailpit.serviceHosts" . | fromJsonArray) $m.smtp.tls.certManager.dnsNames | uniq | join ",") }}
            {{- else if $m.smtp.tls.enabled }}
            {{- $smtpCert = "/tls/smtp/tls.crt" }}
            {{- end }}
            {{- $smtpKey := ternary "/tls/smtp/tls.key" $smtpCert (and $m.smtp.tls.enabled (not $m.smtp.tls.selfSigned)) }}
            {{- include "mailpit.envTable" (list
              (list "MP_UI_BIND_ADDR" "0.0.0.0:8025")
              (list "MP_SMTP_BIND_ADDR" "0.0.0.0:1025")
              (list "MP_DATABASE" ($m.database.url | default "/data/mailpit.db"))
              (list "MP_DISABLE_WAL" $m.database.disableWAL)
              (list "MP_DISABLE_AUTO_VACUUM" $m.database.disableAutoVacuum)
              (list "MP_TENANT_ID" $m.database.tenantId)
              (list "MP_COMPRESSION" $m.compression)
              (list "MP_USE_MESSAGE_DATES" $m.useMessageDates)
              (list "MP_IGNORE_DUPLICATE_IDS" $m.ignoreDuplicateIds)
              (list "MP_QUIET" (eq $m.logLevel "quiet"))
              (list "MP_VERBOSE" (eq $m.logLevel "verbose"))
              (list "MP_WEBROOT" (include "mailpit.webroot" .))
              (list "TZ" $m.timezone)
              (list "MP_MAX_MESSAGES" $m.maxMessages)
              (list "MP_MAX_AGE" $m.maxAge)
              (list "MP_MAX_MESSAGE_SIZE" $m.maxMessageSize)
              (list "MP_LABEL" $m.label)
              (list "MP_DISABLE_VERSION_CHECK" $m.disableVersionCheck)
              (list "MP_UI_AUTH_FILE" (ternary "/secrets/ui.htpasswd" "" $m.ui.auth.enabled))
              (list "MP_UI_TLS_CERT" (ternary "/tls/ui/tls.crt" "" $m.ui.tls.enabled))
              (list "MP_UI_TLS_KEY" (ternary "/tls/ui/tls.key" "" $m.ui.tls.enabled))
              (list "MP_ALLOWED_HOSTS" $allowedHosts)
              (list "MP_API_CORS" $m.ui.apiCors)
              (list "MP_BLOCK_REMOTE_CSS_AND_FONTS" $m.ui.blockRemoteCssAndFonts)
              (list "MP_HIDE_DELETE_ALL_BUTTON" $m.ui.hideDeleteAllButton)
              (list "MP_DISABLE_HTTP_COMPRESSION" $m.ui.disableHttpCompression)
              (list "MP_ALLOW_INTERNAL_HTTP_REQUESTS" $m.ui.allowInternalHttpRequests)
              (list "MP_DISABLE_LINK_CHECK_RATE_LIMIT" $m.ui.disableLinkCheckRateLimit)
              (list "MP_ALLOW_UNTRUSTED_TLS" $m.ui.allowUntrustedTls)
              (list "MP_ENABLE_SPAMASSASSIN" (ternary $m.spamCheck.address "" (eq $m.spamCheck.engine "spamassassin")))
              (list "MP_ENABLE_RSPAMD" (ternary $m.spamCheck.address "" (eq $m.spamCheck.engine "rspamd")))
              (list "MP_SEND_API_AUTH_FILE" (ternary "/secrets/sendApi.htpasswd" "" $m.sendApi.auth.enabled))
              (list "MP_SEND_API_AUTH_ACCEPT_ANY" $m.sendApi.auth.acceptAny)
              (list "MP_SMTP_AUTH_FILE" (ternary "/secrets/smtp.htpasswd" "" $m.smtp.auth.enabled))
              (list "MP_SMTP_AUTH_ACCEPT_ANY" $m.smtp.auth.acceptAny)
              (list "MP_SMTP_AUTH_ALLOW_INSECURE" $m.smtp.auth.allowInsecure)
              (list "MP_SMTP_TLS_CERT" $smtpCert)
              (list "MP_SMTP_TLS_KEY" $smtpKey)
              (list "MP_SMTP_REQUIRE_STARTTLS" $m.smtp.tls.requireStartTLS)
              (list "MP_SMTP_REQUIRE_TLS" $m.smtp.tls.requireTLS)
              (list "MP_SMTP_ALLOWED_RECIPIENTS" $m.smtp.allowedRecipients)
              (list "MP_SMTP_MAX_RECIPIENTS" $m.smtp.maxRecipients)
              (list "MP_SMTP_DISABLE_RDNS" $m.smtp.disableRDNS)
              (list "MP_SMTP_STRICT_RFC_HEADERS" $m.smtp.strictRfcHeaders)
              (list "MP_SMTP_IGNORE_REJECTED_RECIPIENTS" $m.smtp.ignoreRejectedRecipients)
              (list "MP_TAG" $m.tags.filters)
              (list "MP_TAGS_TITLE_CASE" $m.tags.titleCase)
              (list "MP_TAGS_DISABLE" (join "," $m.tags.disable))
              (list "MP_TAGS_USERNAME" $m.tags.username)
              (list "MP_WEBHOOK_URL" (ternary "" $m.webhook.url (not (empty $m.webhook.existingSecret))))
              (list "MP_WEBHOOK_LIMIT" $m.webhook.limit)
              (list "MP_WEBHOOK_DELAY" $m.webhook.delay)
              (list "MP_ENABLE_CHAOS" $m.chaos.enabled)
              (list "MP_CHAOS_TRIGGERS" (ternary $m.chaos.triggers "" $m.chaos.enabled))
              (list "MP_ENABLE_PROMETHEUS" (ternary (printf "0.0.0.0:%d" (int $m.metrics.port)) "" $m.metrics.enabled))
            ) | trim | nindent 12 }}
            {{- with $m.webhook.existingSecret }}
            - name: MP_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $m.webhook.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8025
              protocol: TCP
            - name: smtp
              containerPort: 1025
              protocol: TCP
            {{- if $m.metrics.enabled }}
            - name: metrics
              containerPort: {{ $m.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe: {{- include "mailpit.probe" (dict "ctx" . "probe" .Values.startupProbe "path" "readyz") | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "mailpit.probe" (dict "ctx" . "probe" .Values.livenessProbe "path" "livez") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "mailpit.probe" (dict "ctx" . "probe" .Values.readinessProbe "path" "readyz") | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if $authSources }}
            - name: auth
              mountPath: /secrets
              readOnly: true
            {{- end }}
            {{- if and $m.smtp.tls.enabled (not $m.smtp.tls.selfSigned) }}
            - name: smtp-tls
              mountPath: /tls/smtp
              readOnly: true
            {{- end }}
            {{- if $m.ui.tls.enabled }}
            - name: ui-tls
              mountPath: /tls/ui
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if $authSources }}
        - name: auth
          projected:
            defaultMode: 0440
            sources: {{- toYaml $authSources | nindent 14 }}
        {{- end }}
        {{- if and $m.smtp.tls.enabled (not $m.smtp.tls.selfSigned) }}
        - name: smtp-tls
          secret:
            secretName: {{ include "mailpit.smtpTlsSecretName" . }}
            defaultMode: 0440
        {{- end }}
        {{- if $m.ui.tls.enabled }}
        - name: ui-tls
          secret:
            secretName: {{ $m.ui.tls.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  {{- with .Values.persistence.retentionPolicy }}
  persistentVolumeClaimRetentionPolicy: {{- toYaml . | nindent 4 }}
  {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "mailpit.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
