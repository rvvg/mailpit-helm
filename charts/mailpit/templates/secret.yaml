{{- include "mailpit.validate" . }}
{{- if include "mailpit.createAuthSecret" . }}
{{- $m := .Values.mailpit }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailpit.authSecretName" . }}
  labels: {{- include "mailpit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $m.ui.auth.enabled (not $m.ui.auth.existingSecret) }}
  {{ $m.ui.auth.existingSecretKey }}: {{ required "mailpit.ui.auth.htpasswd is required" $m.ui.auth.htpasswd | quote }}
  {{- end }}
  {{- if and $m.smtp.auth.enabled (not $m.smtp.auth.existingSecret) }}
  {{ $m.smtp.auth.existingSecretKey }}: {{ required "mailpit.smtp.auth.htpasswd is required" $m.smtp.auth.htpasswd | quote }}
  {{- end }}
  {{- if and $m.sendApi.auth.enabled (not $m.sendApi.auth.existingSecret) }}
  {{ $m.sendApi.auth.existingSecretKey }}: {{ required "mailpit.sendApi.auth.htpasswd is required" $m.sendApi.auth.htpasswd | quote }}
  {{- end }}
{{- end }}
