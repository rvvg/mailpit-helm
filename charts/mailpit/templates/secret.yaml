{{- include "mailpit.validate" . }}
{{- $auth := list }}
{{- range include "mailpit.authKinds" . | fromJsonArray }}
{{- if and .enabled (not .existingSecret) }}{{ $auth = append $auth . }}{{ end }}
{{- end }}
{{- if $auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailpit.authSecretName" . }}
  labels: {{- include "mailpit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $auth }}
  {{ .file }}: {{ required (printf "htpasswd for %s auth is required" .name) .htpasswd | quote }}
  {{- end }}
{{- end }}
{{- $cfg := list }}
{{- range include "mailpit.configFiles" . | fromJsonArray }}
{{- if and .enabled (not .existingSecret) }}{{ $cfg = append $cfg . }}{{ end }}
{{- end }}
{{- if $cfg }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailpit.configSecretName" . }}
  labels: {{- include "mailpit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $cfg }}
  {{ .file }}: {{ printf "%s\n" (toYaml .config) | quote }}
  {{- end }}
{{- end }}
