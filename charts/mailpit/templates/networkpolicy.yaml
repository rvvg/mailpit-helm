{{- with .Values.networkPolicy }}
{{- if .enabled }}
{{- $same := list (dict "podSelector" dict) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailpit.fullname" $ }}
  labels: {{- include "mailpit.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mailpit.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- $http := concat (.allowSameNamespace | ternary $same list) .httpFrom }}
    {{- if $http }}
    - ports:
        - port: http
          protocol: TCP
      from: {{- toYaml $http | nindent 8 }}
    {{- end }}
    {{- $smtp := concat (.allowSameNamespace | ternary $same list) .smtpFrom }}
    {{- if $smtp }}
    - ports:
        - port: smtp
          protocol: TCP
      from: {{- toYaml $smtp | nindent 8 }}
    {{- end }}
    {{- $pop3 := concat (.allowSameNamespace | ternary $same list) .pop3From }}
    {{- if and $.Values.mailpit.pop3.enabled $pop3 }}
    - ports:
        - port: pop3
          protocol: TCP
      from: {{- toYaml $pop3 | nindent 8 }}
    {{- end }}
    {{- if and $.Values.mailpit.metrics.enabled .metricsFrom }}
    - ports:
        - port: metrics
          protocol: TCP
      from: {{- toYaml .metricsFrom | nindent 8 }}
    {{- end }}
  {{- if .egress.enabled }}
  egress:
    {{- if .egress.allowDNS }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
