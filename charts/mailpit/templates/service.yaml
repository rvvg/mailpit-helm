apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailpit.fullname" . }}
  labels: {{- include "mailpit.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "mailpit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      appProtocol: {{ .Values.mailpit.ui.tls.enabled | ternary "https" "http" }}
    - name: smtp
      port: {{ .Values.service.smtpPort }}
      targetPort: smtp
      protocol: TCP
{{- if .Values.mailpit.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailpit.fullname" . }}-metrics
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector: {{- include "mailpit.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.mailpit.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- if .Values.smtpService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailpit.fullname" . }}-smtp
  labels: {{- include "mailpit.labels" . | nindent 4 }}
  {{- with .Values.smtpService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.smtpService.type }}
  {{- with .Values.smtpService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.smtpService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector: {{- include "mailpit.selectorLabels" . | nindent 4 }}
  ports:
    - name: smtp
      port: {{ .Values.service.smtpPort }}
      targetPort: smtp
      protocol: TCP
{{- end }}
