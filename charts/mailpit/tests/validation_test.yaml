suite: fail-fast validation
templates:
  - templates/secret.yaml
tests:
  - it: rejects send API auth file together with accept-any
    set:
      mailpit.sendApi.auth: {enabled: true, htpasswd: "u:h", acceptAny: true}
    asserts:
      - failedTemplate:
          errorMessage: mailpit.sendApi.auth.enabled and mailpit.sendApi.auth.acceptAny are mutually exclusive
  - it: rejects required TLS without TLS
    set:
      mailpit.smtp.tls.requireTLS: true
    asserts:
      - failedTemplate:
          errorMessage: mailpit.smtp.tls.requireTLS/requireStartTLS need mailpit.smtp.tls.enabled
  - it: rejects TLS without a certificate source
    set:
      mailpit.smtp.tls.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mailpit.smtp.tls.enabled needs one of secretName, certManager.enabled or selfSigned
  - it: requires an address for the spam check engine
    set:
      mailpit.spamCheck.engine: rspamd
    asserts:
      - failedTemplate:
          errorMessage: mailpit.spamCheck.address is required when mailpit.spamCheck.engine is set
  - it: rejects a webhook URL given both inline and from a secret
    set:
      mailpit.webhook: {url: "https://h.example.com", existingSecret: s}
    asserts:
      - failedTemplate:
          errorMessage: mailpit.webhook.url and mailpit.webhook.existingSecret are mutually exclusive
  - it: requires a relay config when relaying
    set:
      mailpit.smtp.relay.mode: all
    asserts:
      - failedTemplate:
          errorMessage: mailpit.smtp.relay needs config or existingSecret when mode is not disabled
  - it: requires a recipient regex for matching relay
    set:
      mailpit.smtp.relay: {mode: matching, config: {host: x}}
    asserts:
      - failedTemplate:
          errorMessage: mailpit.smtp.relay.matching is required when mode is matching
  - it: requires a forward config when forwarding
    set:
      mailpit.smtp.forward.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mailpit.smtp.forward needs config or existingSecret when enabled
  - it: refuses POP3 without credentials
    set:
      mailpit.pop3.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mailpit.pop3 needs auth.htpasswd or auth.existingSecret - Mailpit requires POP3 authentication
  - it: requires a secret for POP3 TLS
    set:
      mailpit.pop3: {enabled: true, auth: {htpasswd: "u:h"}, tls: {enabled: true}}
    asserts:
      - failedTemplate:
          errorMessage: mailpit.pop3.tls.enabled needs mailpit.pop3.tls.secretName
